name: Lighthouse CI

# Manual trigger only — keeps main CI fast (no Chrome dependency required).
# Full performance budgets (170 KB gzip JS per route, LCP 2.5 s, INP 200 ms,
# CLS 0.1) will be enforced in a later sprint when baselines are measured.
on:
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Run Lighthouse CI
        run: npm run test:lighthouse
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
