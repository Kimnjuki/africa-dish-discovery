# Apex → www. The app's canonical URLs are https://www.ladhaquest.com.
# TLS stays at Cloudflare / Coolify Traefik. This container only listens on
# port 80, so it does not also redirect HTTP to HTTPS (that loops when
# Cloudflare Flexible or Traefik already upgraded the request).
server {
    listen 80;
    server_name ladhaquest.com;
    return 301 https://www.ladhaquest.com$request_uri;
}

server {
    listen 80 default_server;
    server_name www.ladhaquest.com _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Path of the original request, without a query string. Used when the SPA
    # shell is the response so each URL canonicalizes to itself.
    set $lq_canon_path $request_uri;
    if ($request_uri ~ "^([^?]+)") {
        set $lq_canon_path $1;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # IndexNow ownership key. Filename is the key; body is the same key.
    location ~* "^/[a-fA-F0-9]{32}\.txt$" {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
        log_not_found off;
        access_log off;
        try_files $uri =404;
    }

    location ~* ^/sitemap(-[a-z0-9]+)?\.xml$ {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /sitemap-manifest.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location ~* ^/(sw\.js|registerSW\.js|workbox-.+\.js)$ {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location = /index.html {
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '__LQ_CANONICAL__' 'https://www.ladhaquest.com$lq_canon_path';
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '__LQ_CANONICAL__' 'https://www.ladhaquest.com$lq_canon_path';
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
