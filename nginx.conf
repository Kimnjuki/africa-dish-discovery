# Included from http{} via conf.d. Canonical host is https://www.ladhaquest.com
# with NO trailing slash (except "/").
#
# IMPORTANT: use $request_uri (stable) — not $uri. try_files … /index.html does an
# internal redirect that rewrites $uri to /index.html and was baking
# rel=canonical → https://www.ladhaquest.com/index.html on every SPA fallback
# (/dish/*, /story/*, etc.), which GSC reports as "Alternate page with proper canonical".

map $request_uri $lq_path_only {
    ~^(?<path>[^?]*)\?  $path;
    default             $request_uri;
}

map $lq_path_only $lq_canon_path {
    ~^(?<path>.+)/$  $path;
    /index.html      /;
    default          $lq_path_only;
}

# Allow-listed single-facet args for /recipe-index (see src/lib/facetIndexation.ts).
map $args $lq_index_facet {
    "~*^country=[^&]+$"     "?$args";
    "~*^continent=[^&]+$"   "?$args";
    "~*^category=[^&]+$"    "?$args";
    "~*^diet=[^&]+$"        "?$args";
    "~*^ingredient=[^&]+$"  "?$args";
    default                 "";
}

map "$lq_canon_path$lq_index_facet" $lq_canonical {
    ~^(/recipe-index\?.*)$  "https://www.ladhaquest.com$1";
    default                 "https://www.ladhaquest.com$lq_canon_path";
}

# Apex → www. TLS stays at Cloudflare / Coolify Traefik. This container only
# listens on :80, so it does not also redirect HTTP→HTTPS (that loops when
# Cloudflare Flexible or Traefik already upgraded the request).
server {
    listen 80;
    server_name ladhaquest.com;
    return 301 https://www.ladhaquest.com$request_uri;
}

server {
    listen 80 default_server;
    server_name www.ladhaquest.com _;
    root /usr/share/nginx/html;
    index index.html;

    # Prevent absolute http:// Location headers when nginx redirects on :80
    # (Cloudflare/clients would otherwise follow a scheme downgrade).
    absolute_redirect off;
    port_in_redirect off;
    server_name_in_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml;

    # Security headers (HSTS is also set at Cloudflare; keep here for origin).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "upgrade-insecure-requests" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # IndexNow ownership key. Filename is the key; body is the same key.
    location ~* "^/[a-fA-F0-9]{32}\.txt$" {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "no-cache";
        log_not_found off;
        access_log off;
        try_files $uri =404;
    }

    location ~* ^/sitemap(-[a-z0-9]+)?\.xml$ {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /sitemap-manifest.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Social / brand images must stay fetchable and indexable for previews.
    location = /og-image.jpg {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Service worker must never be edge/browser-cached — Cloudflare's default
    # Browser Cache TTL was holding sw.js for 4h and trapping users on old shells.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location ~* ^/workbox-.+\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Hashed static assets only — exclude SW files (matched above via exact/=regex).
    location ~* \.(?:css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location ~* \.js$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Collapse trailing-slash HTML URLs to the no-slash canonical form.
    # Prerender writes /path/index.html; try_files below serves /path without
    # nginx's default directory redirect (which was causing http:// Location).
    location ~ ^(.+)/$ {
        return 301 $1$is_args$args;
    }

    # Legacy /recipes?recipe=<slug> deep links → canonical /recipe/<slug> (one 301).
    # Keeps Google from treating old query URLs as soft duplicates of /recipes.
    location = /recipes {
        if ($arg_recipe != "") {
            return 301 /recipe/$arg_recipe;
        }
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '__LQ_CANONICAL__' $lq_canonical;
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "upgrade-insecure-requests" always;
    }

    # Facet self-canonicals for /recipe-index(?country=…). Rewrites both the
    # live __LQ_CANONICAL__ placeholder and older prerenders that baked the bare URL.
    location ^~ /recipe-index {
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '__LQ_CANONICAL__' $lq_canonical;
        sub_filter 'https://www.ladhaquest.com/recipe-index"' '$lq_canonical"';
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "upgrade-insecure-requests" always;
    }

    location = /index.html {
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '__LQ_CANONICAL__' $lq_canonical;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "upgrade-insecure-requests" always;
        try_files $uri =404;
    }

    location / {
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '__LQ_CANONICAL__' $lq_canonical;
        # Prefer exact file, then prerendered /path/index.html, then SPA shell.
        # Do NOT use `$uri/` — that triggers an external 301 to the slash URL.
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "upgrade-insecure-requests" always;
    }
}
