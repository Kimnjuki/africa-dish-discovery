# Included from http{} via conf.d. Canonical host is https://www.ladhaquest.com
# with NO trailing slash (except "/").
#
# IMPORTANT: use $request_uri (stable) — not $uri. Falling back with
# `try_files … /index.html` is an internal redirect that rewrites $uri to
# /index.html and was baking rel=canonical → https://www.ladhaquest.com/index.html
# on every SPA route. Fallback is the named location @spa (`rewrite … break`)
# so the canonical stays the requested path. Direct /index.html is a 301 to /.

map $request_uri $lq_path_only {
    ~^(?<path>[^?]*)\?  $path;
    default             $request_uri;
}

map $lq_path_only $lq_canon_path {
    ~^(?<path>.+)/$  $path;
    /index.html      /;
    default          $lq_path_only;
}

# Allow-listed single-facet args for /recipe-index (see src/lib/facetIndexation.ts).
map $args $lq_index_facet {
    "~*^country=[^&]+$"     "?$args";
    "~*^continent=[^&]+$"   "?$args";
    "~*^category=[^&]+$"    "?$args";
    "~*^diet=[^&]+$"        "?$args";
    "~*^ingredient=[^&]+$"  "?$args";
    default                 "";
}

map "$lq_canon_path$lq_index_facet" $lq_canonical {
    ~^(/recipe-index\?.*)$  "https://www.ladhaquest.com$1";
    default                 "https://www.ladhaquest.com$lq_canon_path";
}

# Duplicate URLs Google was clustering (GSC: "chose different canonical than user").
# Keep in sync with listCanonicalRedirects() in src/lib/countryCanonical.mjs.
map $lq_canon_path $lq_redirect {
    /index.html                              /;
    /country/cabo-verde                      /country/cape-verde;
    /country/cv                              /country/cape-verde;
    /country/sao-tome                        /country/sao-tome-and-principe;
    /country/st                              /country/sao-tome-and-principe;
    /country/stp                             /country/sao-tome-and-principe;
    /country/ar                              /country/argentina;
    /country/au                              /country/australia;
    /country/cn                              /country/china;
    /country/cy                              /country/cyprus;
    /country/dk                              /country/denmark;
    /country/fr                              /country/france;
    /country/gr                              /country/greece;
    /country/in                              /country/india;
    /country/id                              /country/indonesia;
    /country/ir                              /country/iran;
    /country/it                              /country/italy;
    /country/italia                          /country/italy;
    /country/jp                              /country/japan;
    /country/lb                              /country/lebanon;
    /country/mx                              /country/mexico;
    /country/nz                              /country/new-zealand;
    /country/pk                              /country/pakistan;
    /country/pe                              /country/peru;
    /country/kr                              /country/south-korea;
    /country/korea                           /country/south-korea;
    /country/es                              /country/spain;
    /country/se                              /country/sweden;
    /country/sy                              /country/syria;
    /country/th                              /country/thailand;
    /country/tr                              /country/turkey;
    /country/uae                             /country/united-arab-emirates;
    /country/uk                              /country/united-kingdom;
    /country/gb                              /country/united-kingdom;
    /country/great-britain                   /country/united-kingdom;
    /country/usa                             /country/united-states;
    /country/us                              /country/united-states;
    /country/united-states-of-america        /country/united-states;
    /country/ve                              /country/venezuela;
    /country/vn                              /country/vietnam;
    /country/caribbean                       /countries;
    /country/china-global-chinese-american   /countries;
    /country/global                          /countries;
    /country/global-fusion                   /countries;
    /country/global-modern                   /countries;
    /country/greece-usa                      /countries;
    /country/hawaii                          /countries;
    /country/india-italy                     /countries;
    /country/india-mexico                    /countries;
    /country/india-uk                        /countries;
    /country/italy-usa                       /countries;
    /country/japan-italy                     /countries;
    /country/japan-usa                       /countries;
    /country/mediterranean                   /countries;
    /country/mexico-united-states            /countries;
    /country/mexico-usa                      /countries;
    /country/nigeria-japan                   /countries;
    /country/southeast-asia-thailand-vietnam /countries;
    /country/thailand-usa                    /countries;
    /country/turkey-middle-east              /countries;
    /country/uk-mexico                       /countries;
    /country/uk-usa                          /countries;
    /country/united-states-hawaii            /countries;
    /country/united-states-louisiana         /countries;
    /country/usa-asian-fusion                /countries;
    default                                  "";
}

# Apex → www. TLS stays at Cloudflare / Coolify Traefik. This container only
# listens on :80, so it does not also redirect HTTP→HTTPS (that loops when
# Cloudflare Flexible or Traefik already upgraded the request).
server {
    listen 80;
    server_name ladhaquest.com;
    return 301 https://www.ladhaquest.com$request_uri;
}

server {
    listen 80 default_server;
    server_name www.ladhaquest.com _;
    root /usr/share/nginx/html;
    index index.html;

    # One hop: /index.html, /country/it, /country/usa, fusion labels.
    # $request_uri (not the rewritten file URI) so the SPA fallback can still
    # read /index.html internally without redirecting every route home.
    if ($lq_redirect != "") {
        return 301 $lq_redirect;
    }

    # Prevent absolute http:// Location headers when nginx redirects on :80
    # (Cloudflare/clients would otherwise follow a scheme downgrade).
    absolute_redirect off;
    port_in_redirect off;
    server_name_in_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml;

    # Security headers (HSTS is also set at Cloudflare; keep here for origin).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "upgrade-insecure-requests" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # IndexNow ownership key. Filename is the key; body is the same key.
    location ~* "^/[a-fA-F0-9]{32}\.txt$" {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "no-cache";
        log_not_found off;
        access_log off;
        try_files $uri =404;
    }

    location ~* ^/sitemap(-[a-z0-9]+)?\.xml$ {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /sitemap-manifest.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Social / brand images must stay fetchable and indexable for previews.
    location = /og-image.jpg {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Service worker must never be edge/browser-cached — Cloudflare's default
    # Browser Cache TTL was holding sw.js for 4h and trapping users on old shells.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location ~* ^/workbox-.+\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Hashed static assets only — exclude SW files (matched above via exact/=regex).
    location ~* \.(?:css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location ~* \.js$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Collapse trailing-slash HTML URLs to the no-slash canonical form.
    # GSC was clustering /recipe/foo and /recipe/foo/ as duplicates (31+ pairs).
    # Prerender writes /path/index.html; try_files below serves /path without
    # nginx's default directory redirect (which was causing http:// Location).
    # absolute_redirect off (above) keeps Location relative / host-safe behind CF.
    location ~ ^(.+)/$ {
        return 301 $1$is_args$args;
    }

    # Legacy /recipes?recipe=<slug> deep links → canonical /recipe/<slug> (one 301).
    # Keeps Google from treating old query URLs as soft duplicates of /recipes.
    location = /recipes {
        if ($arg_recipe != "") {
            return 301 /recipe/$arg_recipe;
        }
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '__LQ_CANONICAL__' $lq_canonical;
        try_files $uri $uri/index.html @spa;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "upgrade-insecure-requests" always;
    }

    # Facet self-canonicals for /recipe-index(?country=…). Rewrites both the
    # live __LQ_CANONICAL__ placeholder and older prerenders that baked the bare URL.
    location ^~ /recipe-index {
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '__LQ_CANONICAL__' $lq_canonical;
        sub_filter 'https://www.ladhaquest.com/recipe-index"' '$lq_canonical"';
        try_files $uri $uri/index.html @spa;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "upgrade-insecure-requests" always;
    }

    # Direct /index.html requests. The map above already 301s these; this
    # location is a backstop and must NOT be the try_files fallback. An internal
    # redirect into this location would send every SPA route to /.
    location = /index.html {
        return 301 /;
    }

    # SPA shell. `break` serves index.html in THIS location so the request URI
    # (and therefore the canonical) stays /dish/… or /story/…, not /index.html.
    location @spa {
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '__LQ_CANONICAL__' $lq_canonical;
        rewrite ^ /index.html break;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "upgrade-insecure-requests" always;
    }

    location / {
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '__LQ_CANONICAL__' $lq_canonical;
        # Prefer exact file, then prerendered /path/index.html, then SPA shell.
        # Do NOT use `$uri/` — that triggers an external 301 to the slash URL.
        # Do NOT fall back to the URI /index.html — that re-enters the 301 above.
        try_files $uri $uri/index.html @spa;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "upgrade-insecure-requests" always;
    }
}
