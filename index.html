<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#D97706" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TasteAfrica" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- Primary Meta Tags -->
    <title>TasteAfrica | 50+ Authentic African Recipes & Smart Pantry Matching</title>
    <meta name="description" content="Discover authentic African recipes from West, East, North, and Southern Africa. Our smart pantry intelligence helps you cook with ingredients you already have. Join 10,000+ home cooks." />
    <meta name="keywords" content="african recipes, african food, west african recipes, nigerian recipes, ghanaian food, kenyan cuisine, ethiopian recipes, pantry management, recipe matching, jollof rice, doro wat, bobotie" />
    <meta name="author" content="TasteAfrica" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://6fde0ee8-1c45-43f7-b769-be75373bc9da.lovableproject.com" />

    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="TasteAfrica | Authentic African Recipes with Smart Pantry Matching" />
    <meta property="og:description" content="Discover authentic African recipes with smart pantry intelligence. Cook with ingredients you already have. 50+ recipes from across Africa." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://6fde0ee8-1c45-43f7-b769-be75373bc9da.lovableproject.com" />
    <meta property="og:image" content="https://6fde0ee8-1c45-43f7-b769-be75373bc9da.lovableproject.com/placeholder.svg" />
    <meta property="og:site_name" content="TasteAfrica" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TasteAfrica | Authentic African Recipes" />
    <meta name="twitter:description" content="Discover authentic African recipes with smart pantry matching. Cook with ingredients you already have." />
    <meta name="twitter:image" content="https://6fde0ee8-1c45-43f7-b769-be75373bc9da.lovableproject.com/placeholder.svg" />

    <!-- JSON-LD Structured Data for SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "TasteAfrica",
      "description": "Discover 50+ iconic African recipes from across the continent",
      "url": "https://tasteafrica.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://tasteafrica.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
